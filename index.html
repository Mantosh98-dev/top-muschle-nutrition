<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Unavailable - Top muscle nutrition</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .error-box {
      width: 100%;
      max-width: 620px;
      text-align: center;
      padding: 45px 30px;
      border: 1px solid #292929;
      border-radius: 16px;
      background: #111;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .code {
      font-size: 76px;
      font-weight: 800;
      letter-spacing: -4px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    p {
      color: #999;
      line-height: 1.6;
      font-size: 15px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 25px;
      padding: 9px 14px;
      border-radius: 8px;
      background: #1a1a1a;
      color: #aaa;
      font-size: 13px;
      font-family: monospace;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #ff5252;
      border-radius: 50%;
    }

    .details {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #242424;
      text-align: left;
      font-family: monospace;
      font-size: 12px;
      color: #666;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div class="error-box">

    <div class="code">007</div>

    <h1>Service Permanently Unavailable</h1>

    <p>
      The server is unable to handle the request.
      Please don't try again its harmful.
    </p>

    <div class="status">
      <span class="dot"></span>
      Server connection unavailable
    </div>

    <div class="details">
      Error: SERVICE_UNAVAILABLE<br>
      Status: 503<br>
      Request: FAILED<br>
      Timestamp: <span id="time"></span>
      contact- Develpoer
    </div>

  </div>
  <script>
    document.getElementById("time").textContent =
      new Date().toISOString();
  </script>

</body>
</html>
