<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 Not Found</title>
<style>
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#202124;display:flex;align-items:center;justify-content:center;height:100vh}
.box{max-width:620px;padding:24px}
.code{font-size:88px;font-weight:300;color:#5f6368;margin:0}
h1{font-size:30px;font-weight:400;margin:0 0 16px}
p{color:#5f6368;margin:10px 0}
hr{border:0;border-top:1px solid #e0e0e0;margin:24px 0}
.small{font-size:13px;color:#80868b}
</style>
</head>
<body>
<div class="box">
<div class="code">404</div>
<h1>That’s an error.</h1>
<p>The requested URL was not found on this server.</p>
<p>The server could not locate the requested resource. Please verify the URL or try again later.</p>
<hr>
<p class="small">HTTP ERROR 404</p>
</div>
</body>
</html>
